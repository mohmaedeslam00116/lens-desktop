# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!dist/**"
    - "!dist-electron/**"
    - "!dist-installer/**"
    - "!node_modules/**"
    - "!package-lock.json"
  path_instructions:
    - path: "frontend/electron/engine/**"
      instructions: "Ensure robust error handling, memory boundedness, proper AbortSignal forwarding, and safe UTF-8 byte stream chunk concatenation."
    - path: "frontend/src/**"
      instructions: "Adhere to BRAND.md and DESIGN.md: monochrome neutral palette (#111111/#191919), Inter and Cairo typography, bilingual Arabic/English parity."
chat:
  auto_reply: true
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTEXT.md"
      - "PRODUCT.md"
      - "BRAND.md"
      - "DESIGN.md"
