name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build engine, and test
    # LENS ships as a Windows desktop client, and the embedded engine is
    # validated against that runtime, so the gate runs where the product runs.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer and Electron main
        run: npm run typecheck

      # The test suite imports the compiled engine from dist-electron, so the
      # engine build is a prerequisite of the tests, not just of packaging.
      - name: Build embedded engine
        run: npm run build:electron

      - name: Run test suite
        run: npm test

      - name: Build renderer bundle
        run: npx vite build

  packaged-smoke:
    name: Packaged runtime smoke test
    # The suite runs the engine from source. This job proves the artifact users
    # actually receive still boots: packaged Electron main, preload bridge,
    # bundled renderer, asar, and the embedded engine inside them.
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer bundle
        run: npx vite build

      - name: Build embedded engine
        run: npm run build:electron

      - name: Package unpacked build
        run: npm run pack:unpacked

      - name: Verify packaged artifact contents
        # Packaging can silently drop or stale-build a file that the sources
        # declare. Reading the packaged bytes first means the smoke test that
        # follows never has to guess whether it is driving current behaviour.
        run: npm run verify:package

      - name: Smoke test the packaged runtime
        # A CI runner is slower than a workstation, so the readiness deadline is
        # generous; the script still fails on the first contract violation.
        run: npm run smoke:packaged -- --timeout 180000
